appId: com.calixpass.app
productName: Calix Pass
copyright: Copyright (c) 2026 Calix Pass

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Calix-Pass-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false

publish:
  - provider: github
